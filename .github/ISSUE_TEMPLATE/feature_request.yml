name: ✨ Feature request
description: Propose a new feature or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! Describe the current situation and its impact so someone outside this conversation can evaluate the proposal. Maintainers will triage difficulty, design/evaluation needs, and contributor invitation labels after submission.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Give the observed starting state, an example or reproduction, and user/Agent impact. Link the current behavior or contract when known; say when a claim is only a hypothesis. The reader should not need your private chat to understand the gap.
      placeholder: "With <host/version> and <starting state>, doing <task> currently produces <observed result>. This affects <user/Agent> because ... . Existing workaround: ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The proposed solution
      description: Describe the user/Agent-visible outcome, the scope and a realistic failure path. Explain the decision or evidence gate before implementation when the mechanism is not verified; do not turn a suggested approach into an accepted contract.
      placeholder: "When <situation>, Lorelum should <observable outcome>; if <failure>, it should <safe recovery>. This issue excludes <adjacent work>. The proposed mechanism still needs <evidence/design decision>."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other ways could this be solved? Why is yours better?
    validations:
      required: false

  - type: textarea
    id: evidence-boundary
    attributes:
      label: Verified evidence and open questions
      description: Separate what you observed or checked from what still needs a real-host test, measurement, or design decision. For an early idea with no reproduction, say so plainly rather than inventing evidence.
      placeholder: "Verified: <behavior, source, test or concrete scenario>. Not yet verified: <assumption or missing host behavior>. Decision needed before implementation: <only if material>."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: When is this done? Cover the normal path, relevant failure/recovery path, and compatibility or migration where applicable. Each item should be observable, not merely "add tests" or "update docs".
      placeholder: |
        - [ ] Given <starting state>, when <action>, the user/Agent sees <result>.
        - [ ] When <realistic failure>, <clear result or automatic recovery> occurs without losing work.
        - [ ] Existing <workflow> continues to work, or the changed behavior and migration are documented.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI (`lore`)
        - Retrieval engine
        - Practice / pack format
        - Agent Skill / Plugin
        - Documentation
        - Evaluation / examples
        - Other
    validations:
      required: true

  - type: textarea
    id: field-evidence
    attributes:
      label: Optional field feedback or local draft evidence
      description: If you created a local `lore feedback draft`, paste the whole report or the parts that help explain the problem, constraints, or missed guidance. This does not submit diagnostics automatically.
    validations:
      required: false

  - type: checkboxes
    id: disclosure-review
    attributes:
      label: Public disclosure review
      description: Public Issues are visible. Remove credentials, secrets, and anything else you do not want public before adding local evidence.
      options:
        - label: I removed credentials or other secrets from the local evidence I chose to disclose.
          required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and Discussions and this is not a duplicate.
          required: true
        - label: I understand this is a proposal — maintainers will decide if/when it's picked up, and a spec may be required.
          required: true
