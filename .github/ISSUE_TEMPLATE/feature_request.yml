name: ✨ Feature request
description: Propose a new feature or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! Tell us the problem first, then the solution.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Give enough standalone context for someone unfamiliar with your environment. Who is affected, what are they trying to do, what happens today, and why is that a problem?
      placeholder: "When using Lorelum with <host> to do <task>, I currently have to ... . This causes ... . Existing behavior/workaround: ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The proposed solution
      description: Describe the user/Agent-visible outcome and the boundary of this issue. Suggest an approach if useful, but do not turn an unverified implementation guess into a requirement.
      placeholder: "When <situation>, Lorelum should <observable outcome>. This issue does not include <adjacent feature>."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other ways could this be solved? Why is yours better?
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: When is this done? Cover the normal path, relevant failure/recovery path, and compatibility or migration where applicable. Each item should be observable, not merely "add tests" or "update docs".
      placeholder: |
        - [ ] Given <starting state>, when <action>, the user/Agent sees <result>.
        - [ ] When <realistic failure>, <clear result or automatic recovery> occurs without losing work.
        - [ ] Existing <workflow> continues to work, or the changed behavior and migration are documented.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI (`lore`)
        - Retrieval engine
        - Practice / pack format
        - Agent Skill / Plugin
        - Documentation
        - Evaluation / examples
        - Other
    validations:
      required: true

  - type: textarea
    id: field-evidence
    attributes:
      label: Optional field feedback or local draft evidence
      description: If you created a local `lore feedback draft`, paste the whole report or the parts that help explain the problem, constraints, or missed guidance. This does not submit diagnostics automatically.
    validations:
      required: false

  - type: checkboxes
    id: disclosure-review
    attributes:
      label: Public disclosure review
      description: Public Issues are visible. Remove credentials, secrets, and anything else you do not want public before adding local evidence.
      options:
        - label: I removed credentials or other secrets from the local evidence I chose to disclose.
          required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and Discussions and this is not a duplicate.
          required: true
        - label: I understand this is a proposal — maintainers will decide if/when it's picked up, and a spec may be required.
          required: true
