name: 🐛 Bug report
description: Report something that's broken or behaves unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search existing issues first to avoid duplicates.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: In one or two sentences, describe the task, the actual result, and its impact. Include enough context for someone who did not see your session.
      placeholder: "While doing <task> with `lore ...`, I got <actual result>. This prevented <outcome>."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: State the relevant starting state (installed Packs, config, host, or permissions), then concrete steps and the observed output. If not reliably reproducible, say how often it occurs and what you did observe.
      placeholder: |
        1. `lore pack install agentic-coding`
        2. `lore query "..."`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened in this situation, including a sensible failure/recovery outcome if the normal path cannot succeed?
    validations:
      required: true

  - type: input
    id: lore-version
    attributes:
      label: Lorelum version
      description: Output of `lore --version` (or the commit hash if running from source).
      placeholder: "0.0.0-dev / commit abc1234"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: OS + runtime version + AI tool (if relevant).
      placeholder: "macOS 14 / <runtime + version> / Cursor 0.40"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Reviewed feedback draft, logs, or error output
      description: Optionally attach a local `lore feedback draft`, full trace excerpt, or stack trace when it helps reproduction. A local draft stays on your machine until you paste it here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: evidence-boundary
    attributes:
      label: Verified and missing evidence
      description: Separate observation from suspected cause. What did you verify locally, what is only a hypothesis, and what relevant evidence is missing? Leave blank if the reproduction above is complete.
      placeholder: "Verified: native process exited before readiness. Missing: a minimal reproduction outside this project."
    validations:
      required: false

  - type: checkboxes
    id: disclosure-review
    attributes:
      label: Public disclosure review
      description: Public Issues are visible. Ordinary query, result, path, and stack evidence can be useful; remove credentials, secrets, and anything else you do not want public.
      options:
        - label: I removed credentials, cookies, tokens, private keys, signed URLs, and other secrets.
          required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
